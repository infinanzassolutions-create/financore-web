# Bloquea llaves, contraseñas y tokens subidos por error. Revisa TODO el historial.
# Usa el binario oficial de gitleaks (versión fija y checksum comprobado), no la acción:
# la acción lee los commits del PR por la API y fallaba en repos cuyo nombre termina en punto.
name: Llaves expuestas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versión fija)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Buscar llaves en el código y el historial
        run: ./gitleaks git --redact --verbose --exit-code 1 .
